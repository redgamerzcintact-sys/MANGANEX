server:
  port: 8080

spring:
  application:
    name: manganex-enterprise-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:file:./manganex-java-db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false

manganex:
  security:
    jwt:
      secret: ${MANGANEX_JWT_SECRET:}
      expiration-ms: ${MANGANEX_JWT_EXPIRATION_MS:86400000} # 24 hours
    allow-demo-reset-token: ${ALLOW_DEMO_AUTH_TOKENS:false}
  cors:
    allowed-origins: ${MANGANEX_CORS_ORIGINS:http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173}
  python-ai-service:
    base-url: ${PYTHON_AI_SERVICE_URL:http://127.0.0.1:8000}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
