services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: manganex-api
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./manganex.db
      - SECRET_KEY=manganex-national-hackathon-demo-key-2025
      - ENVIRONMENT=production
      - CORS_ORIGINS=["http://localhost", "http://localhost:80", "http://localhost:3000", "http://127.0.0.1:3000"]
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: manganex-web
    ports:
      - "3000:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
